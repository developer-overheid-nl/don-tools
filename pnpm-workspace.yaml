  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'
  - vitest@4.1.11

overrides:
  brace-expansion@<1.1.18: 1.1.18
  fast-uri@<=3.1.4: 3.1.5
  'fast-xml-parser@>=5.9.3 <5.10.1': 5.10.1
  fast-xml-builder@<=1.1.6: 1.2.0
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  lodash@<=4.17.23: 4.18.1
  uuid@<11.1.1: 14.0.0
